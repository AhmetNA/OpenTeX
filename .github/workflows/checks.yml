name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Swift and native integration checks
        run: ./Tests/run.sh
      - name: Build application for local testing
        run: RAPOR_ALLOW_ADHOC=1 ./build.sh
